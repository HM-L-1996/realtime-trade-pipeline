# 알람 규칙. docs/failure-policy.md 의 등급 구분을 그대로 옮긴 것이다.
# 깨우는 것과 대시보드에 둘 것을 severity 로 가른다.
groups:
  - name: rtp
    rules:
      # 신선도. "잡이 살아있는 것" 과 "결과가 나오는 것" 은 다르다.
      # 유휴 파티션 실험에서 모든 지표가 초록불인데 출력이 0이었다.
      #
      # **집계한 뒤에 비교해야 한다.** 이 지표는 subtask 마다 시리즈가 따로 있고,
      # 병렬도 3 이면 6개가 나온다. 어떤 subtask 는 그 10분 동안 할당된 종목이
      # 없어 정상적으로 0 이다. 집계 없이 `== 0` 을 걸면 그 시리즈들이 매칭되고,
      # `and on()` 이 빈 키로 교차시켜 **파이프라인이 멀쩡한데도 발화한다.**
      # 실제로 규칙을 켜자마자 첫 평가에서 pending 이 됐다 (합계는 2.19 였다).
      # 거짓 양성으로 사람을 깨우는 알람은 없는 알람보다 나쁘다.
      - alert: NoCandlesProduced
        expr: |
          sum(increase(flink_taskmanager_job_task_operator_clickhouseCandleRows[10m])) == 0
          and on() max(rtp_ingester_connected) == 1
          and on() sum(increase(rtp_ingester_trades_total[10m])) > 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "체결은 들어오는데 캔들이 10분째 안 나온다"
          description: "유휴 파티션으로 워터마크가 멈췄을 수 있다. idleness 설정을 확인할 것."

      # 소스 단절. 그 구간의 체결은 되메울 수 없다.
      - alert: IngesterDisconnected
        expr: max(rtp_ingester_connected) == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "수집기 WebSocket 이 2분째 끊겨 있다"
          description: "소스에 시퀀스가 없어 이 구간은 되메울 수 없다."

      # 체크포인트 실패. 방치하면 재처리 구간이 계속 늘어난다.
      - alert: CheckpointsFailing
        # 잡이 여러 개면 합계는 의미가 없다. 가장 나쁜 잡을 본다.
        #
        # **막 재시작한 잡은 제외한다.** savepoint 재배포 직후에는 체크포인트가
        # 몇 번 실패하는 것이 정상이다. 실제로 이 알람을 켜고 첫 재배포에서
        # 곧바로 pending 이 됐다(10분간 3.08회). 그것으로 사람을 깨우면
        # "배포할 때마다 울리는 알람" 이 되고, 그러면 곧 무시된다.
        # uptime 은 ms 단위이므로 600000 = 10분이다.
        #
        # **job_name 이 아니라 job_id 로 묶는다.** job_name 은 잡을 다시 띄워도
        # 같지만 job_id 는 인스턴스마다 다르다. job_name 으로 묶었더니
        # 죽은 잡의 uptime 시리즈(25시간)가 아직 안 사라져서 `max()` 가 그것을
        # 집었고, 재배포 직후 3분 동안 가드가 무력해져 알람이 떴다.
        # 같은 잡의 재시작 횟수와 그 잡의 uptime 을 비교해야 한다.
        expr: |
          max by (job_id) (
            increase(flink_jobmanager_job_numberOfFailedCheckpoints[10m])
          ) > 3
          and on (job_id)
          max by (job_id) (flink_jobmanager_job_uptime) > 600000
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "체크포인트가 10분간 3회 이상 실패"
          description: "싱크가 막혔을 가능성. 복구 시 재처리 구간이 그만큼 길어진다."

      # 아래는 깨우지 않는다. 추세만 본다.
      - alert: LateTradesDropping
        # 여기서는 합계가 맞다. 버려진 총건수가 곧 관심사다.
        expr: sum(increase(flink_taskmanager_job_task_operator_lateTradesDropped[15m])) > 100
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "늦게 도착해 버려지는 체결이 늘고 있다"
          description: "워터마크 지연을 늘리면 줄지만 결과가 늦어진다. 즉시 조치할 것은 없다."

      # lag 은 반드시 **그룹별로** 본다. 죽은 그룹이 무한히 쌓기 때문에
      # 전체 합계는 의미가 없다 - 실제로 유령 컨슈머 그룹에 당한 적이 있다.
      #
      # 쌓여 있는 것만으로는 알람이 아니다. 재시작 직후에는 원래 밀려 있고
      # 곧 따라잡는다. **높으면서 동시에 계속 늘어나는 것**이 신호다.
      - alert: ConsumerLagGrowing
        #
        # 그룹명을 하나로 못 박았다가 틀렸다. compose 는 `rtp-candle-1m`,
        # K8s 는 `rtp-candle-k8s` 인데 앞의 것을 적어 두어서 **영원히 발화하지 않는
        # 알람**이 되어 있었다. 로드도 되고 문법도 맞고 health=ok 인데 대상이 없었다.
        #
        # 그래서 접두어로 고른다. 운영 그룹은 `rtp-`, 실험 그룹은 `exp-` 를 쓴다.
        # 실험 그룹을 빼는 것이 핵심이다 - 실제로 죽은 실험 그룹 `exp-idle0` 이
        # lag 115,884 을 쌓은 채 남아 있고, 그것까지 세면 알람이 상시 발화한다.
        expr: |
          sum by (consumergroup) (
            kafka_consumergroup_lag{consumergroup=~"rtp-.*"}
          ) > 20000
          and
          deriv(
            sum by (consumergroup) (
              kafka_consumergroup_lag{consumergroup=~"rtp-.*"}
            )[10m:1m]
          ) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "컨슈머 lag 이 2만 건을 넘었고 계속 늘고 있다"
          description: "따라잡는 중이면 deriv 가 음수라 발화하지 않는다. busyRatio 와 백프레셔를 볼 것."

      # 잡이 반복해서 재시작하는가.
      #
      # **이 알람이 없어서 장중 사고를 손으로 알아챘다.** 검증 안 된 부가 싱크가
      # 첫 캔들에서 죽었고, Flink 에서 한 연산자의 실패는 잡 전체의 재시작이라
      # 파이프라인이 재시작 루프에 빠졌다. 그 사이 같은 윈도가 여섯 번 기록됐다.
      #
      # 재시작 자체는 정상이다 - TaskManager 가 죽으면 복구하는 것이 맞다.
      # 문제는 **반복**이다. 10분에 세 번을 넘으면 스스로 낫지 못하는 상태다.
      - alert: JobRestartLooping
        expr: max by (job_name) (increase(flink_jobmanager_job_numRestarts[10m])) > 3
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.job_name }} 이 10분간 3회 넘게 재시작했다"
          description: "재시작마다 이미 닫힌 윈도가 다시 발행되어 중복이 쌓인다. 실패하는 연산자를 찾아 끄는 것이 먼저다."

      # 아무도 읽지 않는 파티션이 있는가.
      #
      # **lag 으로는 절대 잡을 수 없는 사고다.** Flink 의 파티션 재발견은 기본이
      # 꺼짐이라, 토픽 파티션을 늘리면 새 파티션을 영원히 읽지 않는다. 그런데
      # 컨슈머 그룹은 자기가 아는 파티션만 보고하므로 **lag 은 0** 이고,
      # kafka-exporter 는 커밋이 없는 파티션을 **lag=-1** 로 내서 합계가 음수가 된다.
      #
      # 실측: 3->7 로 늘렸더니 새 파티션 두 개에 1만 531건이 쌓이는 동안
      # 잡은 RUNNING/STABLE, lag 합계는 -5 였고 캔들 출력은 완전히 멈췄다.
      #
      # 그래서 "데이터가 있는데 커밋 오프셋이 없는 파티션" 을 직접 본다.
      # 종목이 없어 비어 있는 파티션은 끝 오프셋이 0 이라 걸리지 않는다
      # (운영 토픽의 p0 이 그렇다 - 거짓 양성이 없는 것을 실측으로 확인했다).
      - alert: PartitionNotConsumed
        expr: |
          (kafka_topic_partition_current_offset{topic=~"trades.*"} > 0)
          and on (topic, partition)
          (max by (topic, partition) (
            kafka_consumergroup_current_offset{consumergroup=~"rtp-.*"}
          ) == -1)
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.topic }} 파티션 {{ $labels.partition }} 을 아무도 읽지 않는다"
          description: "파티션 재발견이 꺼져 있을 수 있다. lag 은 0으로 보이지만 데이터는 처리되지 않는다."

  # ── 계측 자신을 계측한다 ────────────────────────────────────────────
  #
  # 알람 규칙을 정성껏 써 놓고 Prometheus 가 그 파일을 로드하지 않아
  # 전부 죽어 있던 적이 있다. 파드는 Running 이었고 helm lint 도 통과했다.
  # "초록불인데 고장난 경우" 의 전형이라 같은 일이 반복되지 않게 규칙으로 막는다.
  - name: rtp-meta
    rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 3m
        labels: { severity: warning }
        annotations:
          summary: "스크레이프 타깃 {{ $labels.job }} 이 3분째 응답하지 않는다"
          description: "지표가 안 보이는 것과 대상이 정상인 것은 다르다. 빈 그래프를 정상으로 읽지 말 것."

      # 규칙 파일이 로드됐는지 자체를 본다. rule_files 를 빠뜨리면 이 값이 0 이 된다.
      - alert: AlertRulesNotLoaded
        expr: sum(prometheus_rule_group_rules) < 5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "로드된 알람 규칙 수가 예상보다 적다"
          description: "rule_files 누락이나 규칙 파일 문법 오류일 수 있다. 알람 전체가 침묵한다."

      # 발화한 알람을 받을 곳이 실제로 붙어 있는가.
      - alert: AlertmanagerUnreachable
        expr: prometheus_notifications_alertmanagers_discovered < 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Alertmanager 가 하나도 발견되지 않았다"
          description: "규칙이 발화해도 전달되지 않고 Prometheus UI 안에서만 빨간불이 된다."
