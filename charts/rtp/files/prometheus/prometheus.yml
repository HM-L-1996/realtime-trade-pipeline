# 장애 실험용 계측. 여기서 뽑는 값이 failure-notes.md 의 근거가 된다.
global:
  scrape_interval: 5s      # 체크포인트 주기가 10초라 그보다 촘촘해야 의미가 있다
  evaluation_interval: 15s

# 규칙 파일을 여기서 읽어야 알람이 평가된다.
#
# **이 한 줄이 없어서 alerts.yml 이 통째로 죽어 있었다.** 파일은 ConfigMap 으로
# 마운트되어 컨테이너 안에 멀쩡히 존재했고, `helm lint` 도 통과했고, 파드도 Running
# 이었다. 그런데 Prometheus 는 그 파일을 읽지 않았으므로 규칙은 한 번도 평가되지
# 않았다. 자세한 것은 failure-notes.md 의 "알람을 썼는데 로드되지 않았다".
rule_files:
  - /etc/prometheus/alerts.yml

# 평가된 알람을 보낼 곳. 이것이 없으면 규칙이 발화해도 Prometheus 웹 UI 안에서만
# 빨간불이 되고 아무에게도 전달되지 않는다.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager.rtp.svc.cluster.local:9093"]

scrape_configs:
  # Flink JobManager / TaskManager.
  # **정적 타깃으로는 안 된다** - TaskManager Pod 은 잡이 재시작될 때마다 이름이 바뀌고
  # (candle-1m-taskmanager-1-1 -> -1-2), Operator 가 필요에 따라 늘리고 줄인다.
  # 실제로 Pod 강제 종료 실험에서 이름이 바뀌었다.
  - job_name: flink
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [rtp]
    relabel_configs:
      # Flink Operator 가 붙이는 라벨로 고른다.
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: candle-1m|exp-.*
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: $1:9249
      - source_labels: [__meta_kubernetes_pod_label_component]
        target_label: component      # jobmanager / taskmanager
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: flink_job

  # 수집기. 소스 유실과 파이프라인 버그를 구분하는 지표가 여기서 나온다.
  - job_name: ingester
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [rtp]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: ingester
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: $1:9200
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # ClickHouse 내장 엔드포인트. 파트 수·머지 지연·삽입 실패.
  # 파트가 치솟으면 "too many parts" 로 적재가 막힌다.
  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse.rtp.svc.cluster.local:9363"]

  # Kafka 는 Prometheus 를 네이티브로 지원하지 않는다. exporter 가 필요하다.
  # 여기서 나오는 kafka_consumergroup_lag 이 "처리가 유입을 못 따라간다" 를
  # 판정하는 유일한 직접 지표다. compose 에는 있었는데 K8s 로 옮기며 빠졌고,
  # 그래서 ConsumerLagGrowing 알람이 한동안 캔들 적재량으로 lag 을 흉내내고 있었다.
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter.rtp.svc.cluster.local:9308"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager.rtp.svc.cluster.local:9093"]
