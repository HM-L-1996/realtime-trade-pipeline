# 기본값은 로컬 kind 클러스터 기준이다.
# 운영이라면 credentials 는 외부에서 주입해야 한다 -
# docs/working-notes.md 의 "K8s 이전 시 반드시 바꿀 것" 참고.

kafka:
  image: apache/kafka:3.9.0
  storage: 5Gi
  # 파티션을 명시한다. auto-create 에 맡기면 조용히 1이 되어
  # "파티션을 늘렸을 때 종목별 순서" 실험의 전제가 무너진다.
  topics:
    - name: trades.raw
      partitions: 3
    - name: trades.replay
      partitions: 3
  resources:
    requests: { cpu: 200m, memory: 1Gi }
    limits: { memory: 2Gi }

# 로컬 kind 클러스터 전용 자격증명이다. 공개 저장소이므로 여기 적힌 값이
# 곧 공개된다는 뜻이고, 실제 환경이라면 이 자리에 값을 두면 안 된다.
# 이 프로젝트에서는 External Secrets / SOPS 를 붙이지 않았다 -
# 채우려는 공백과 축이 다르고 범위만 넓어진다. 대신 컨테이너로 값이 들어가는
# 경로는 전부 Secret 을 거치게 해서, 값을 바꿀 때 고칠 곳이 한 군데가 되게 했다.
clickhouse:
  image: clickhouse/clickhouse-server:24.8
  storage: 10Gi
  db: rtp
  user: rtp
  password: rtp
  resources:
    requests: { cpu: 300m, memory: 1Gi }
    limits: { memory: 3Gi }

minio:
  enabled: true
  image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
  mcImage: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
  storage: 10Gi
  accessKey: rtpadmin
  secretKey: rtpadmin123
  bucket: warehouse

icebergRest:
  # 두 번째 싱크(Iceberg)를 위한 REST 카탈로그.
  # 켜면 캔들이 ClickHouse 와 Iceberg **양쪽에** 쓰인다. 대체가 아니라 병행이다.
  # 두 싱크의 전달 보장이 달라서(at-least-once vs exactly-once)
  # 재시작 시 중복이 어떻게 갈리는지를 결과로 비교할 수 있다.
  enabled: true
  image: apache/iceberg-rest-fixture:1.9.1

# 수집기. 자격 증명은 차트에 없다 - 배포 전에 Secret 을 따로 만든다:
#   kubectl create secret generic toss-credentials -n rtp --from-env-file=.env
# public 저장소이므로 키가 values.yaml 에 들어가면 안 된다.
ingester:
  enabled: true
  image: rtp-ingester:0.1.2
  imagePullPolicy: Never
  topic: trades.raw
  symbols: "005930,000660"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

# 공식 캔들 수집기 = 정답지. 없으면 validation.md 를 쓸 수 없다.
officialCandles:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 512Mi }

# Prometheus + Grafana. compose 에는 있었는데 K8s 로 옮기며 빠져 있었다 -
# 지금까지 만든 메트릭이 K8s 에서 전부 안 보이는 상태였다.
# Grafana 는 NodePort 30300 -> 호스트 13000 (kind-cluster.yaml 참고)
observability:
  enabled: true
  prometheusImage: prom/prometheus:v3.1.0
  grafanaImage: grafana/grafana:11.4.0
  alertmanagerImage: prom/alertmanager:v0.28.0
  # 지표 이력을 Pod 재생성 너머로 보존한다. 장애 실험의 파형이 핵심 근거라
  # emptyDir 로는 설정 한 번 고칠 때마다 사라진다 - 실제로 잃었다.
  prometheusStorage: 20Gi
  kafkaExporterImage: danielqsj/kafka-exporter:v1.8.0

flink:
  enabled: true
  # 코드가 바뀌면 **태그를 올린다.** 같은 태그로 다시 적재하면 매니페스트가
  # 그대로라 Operator 가 변경을 감지하지 못하고, 파드는 노드에 캐시된 옛 이미지를
  # 계속 쓴다. imagePullPolicy: Never 라 더욱 그렇다.
  # 태그를 올리면 spec 이 바뀌므로 upgradeMode: savepoint 경로를 타고 재배포된다.
  image: rtp-aggregator:0.1.5
  # kind load 로 노드에 적재한 로컬 이미지다. 레지스트리에서 받으려 하면 실패한다.
  imagePullPolicy: Never
  version: v1_20
  parallelism: 3
  # 슬롯을 병렬도보다 넉넉히 둔다. 3개면 잡 하나가 전부 차지해
  # 설정 비교 실험(같은 입력에 조건만 바꿔 두 잡을 나란히)을 띄울 수 없다.
  # compose 에서 3 -> 6 으로 올린 것과 같은 이유다. validation.md 의 표를
  # 채우는 방법 자체가 이 여유에 달려 있다.
  taskSlots: 6
  jobManager:
    memory: 1600m
    cpu: 0.5
  taskManager:
    memory: 2048m
    cpu: 1
  job:
    topic: trades.raw
    groupId: rtp-candle-k8s
    runId: k8s-wm5
    # Iceberg 쪽 테이블. 네임스페이스를 포함해야 한다.
    icebergTable: rtp.candles_1m
    # validation.md 의 "설정 변경에 따른 정확도 변화" 표가 이 값들을 바꿔가며 나온다.
    watermarkDelaySeconds: 5
    idlenessSeconds: 10
    allowedLatenessSeconds: 0
    archiveTrades: true
  checkpoint:
    intervalSeconds: 10
