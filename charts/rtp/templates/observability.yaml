{{- if .Values.observability.enabled }}
{{/*
  Prometheus + Grafana.
  compose 에는 있었는데 K8s 로 옮기며 빠져 있었다 - 지금까지 만든 메트릭
  (소스 유실, 늦은 체결 드롭, 체크포인트 소요, 파트 수)이 K8s 에서 전부 안 보였다.

  Flink TaskManager 는 정적 타깃으로 잡을 수 없다. Pod 이름이 재시작마다 바뀌고
  (실측: -1-1 -> -1-2) Operator 가 필요에 따라 늘리고 줄인다. 서비스 디스커버리를 쓴다.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
rules:
  # Pod 디스커버리에만 쓴다. 최소 권한.
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
{{ (.Files.Glob "files/prometheus/*.yml").AsConfig | indent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector: { app: prometheus }
  ports:
    - { name: http, port: 9090, targetPort: 9090 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
      annotations:
        checksum/config: {{ (.Files.Glob "files/prometheus/*.yml").AsConfig | sha256sum }}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: {{ .Values.observability.prometheusImage }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            {{/* 실험 전후를 비교하려면 과거 구간이 남아 있어야 한다. */}}
            - --storage.tsdb.retention.time=15d
            - --web.enable-lifecycle
          ports:
            - { containerPort: 9090, name: http }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        {{/*
          emptyDir 다. Pod 이 죽으면 지표 이력이 사라진다.
          실험 중에만 쓰는 용도라 감수한다 - PVC 를 붙이면 노드 고정 문제가 생기고
          이 프로젝트가 채우려는 공백과 무관한 작업이 늘어난다.
        */}}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  selector: { app: grafana }
  ports:
    - { name: http, port: 3000, targetPort: 3000, nodePort: 30300 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  # 대시보드를 어디서 읽을지 알려 준다. 이것이 없으면 대시보드 JSON 을
  # 마운트해도 Grafana 가 읽지 않아 빈 화면만 보인다.
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: rtp
        type: file
        folder: RTP
        options:
          path: /var/lib/grafana/dashboards
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: rtp-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.{{ .Release.Namespace }}.svc.cluster.local:9090
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: {{ .Values.observability.grafanaImage }}
          env:
            {{/* 로컬 전용. working-notes.md 의 "K8s 이전 시 반드시 바꿀 것" 참고. */}}
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: admin }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin }
          ports:
            - { containerPort: 3000, name: http }
          volumeMounts:
            {{/*
              datasources 와 dashboards 는 provisioning 아래 **다른 디렉터리**여야 한다.
              한 ConfigMap 을 두 경로에 subPath 로 나눠 넣는다.
            */}}
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml }
            - { name: dashboards,   mountPath: /var/lib/grafana/dashboards }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: provisioning
          configMap: { name: grafana-provisioning }
        - name: dashboards
          configMap: { name: grafana-dashboards }
---
{{/*
  대시보드 JSON. compose 에는 처음부터 있었는데 K8s 로 옮기며 빠져 있었다 -
  NodePort 로 접속하면 Grafana 는 뜨는데 볼 것이 하나도 없었다.
  차트가 원본을 소유하고 compose 가 같은 파일을 마운트한다.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
{{ (.Files.Glob "files/grafana/*.json").AsConfig | indent 2 }}
---
{{/*
  Kafka 는 Prometheus 를 네이티브로 지원하지 않는다. 컨슈머 그룹 lag 은
  exporter 없이는 볼 수 없고, lag 은 "처리가 유입을 못 따라간다" 를 판정하는
  유일한 직접 지표다.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
spec:
  selector: { app: kafka-exporter }
  ports:
    - { name: http, port: 9308, targetPort: 9308 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels: { app: kafka-exporter }
  template:
    metadata:
      labels: { app: kafka-exporter }
    spec:
      containers:
        - name: kafka-exporter
          image: {{ .Values.observability.kafkaExporterImage }}
          args:
            {{/*
              compose 는 19092, K8s Service 는 9092 다. compose 값을 그대로 옮겼다가
              exporter 가 연결을 기다리느라 HTTP 리스너를 아예 열지 못했다.
              파드는 Running 이고 로그에는 "Starting kafka_exporter" 한 줄뿐이었다.
            */}}
            - --kafka.server=kafka.{{ .Release.Namespace }}.svc.cluster.local:9092
            - --web.listen-address=:9308
          ports:
            - { containerPort: 9308, name: http }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
---
{{/*
  Alertmanager.

  이것이 없으면 규칙이 발화해도 Prometheus UI 안에서만 빨간불이 되고
  아무에게도 전달되지 않는다. failure-policy.md 는 severity=page 를
  "깨운다" 로 정의했는데, 깨워 줄 수신처가 없으면 그 정의가 거짓이 된다.

  **실제 통보 채널(Slack 등)은 붙이지 않았다.** 공개 저장소라 웹훅 URL 을
  커밋할 수 없다. 대신 라우팅까지는 진짜로 동작하게 두고, 최종 수신처만
  로그로 떨어지는 webhook 으로 둔다 - 발화·묶임·억제까지는 관측할 수 있다.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
data:
  alertmanager.yml: |
    route:
      receiver: default
      group_by: [alertname, severity]
      group_wait: 30s
      group_interval: 5m
      # page 는 반복해서 다시 알린다. warning 은 조용히 둔다.
      repeat_interval: 4h
      routes:
        - matchers: [severity="page"]
          receiver: default
          repeat_interval: 1h
    # 소스가 끊기면 캔들도 안 나온다. 원인 알람이 이미 떠 있으면
    # 결과 알람은 억제한다 - 한 사건에 알람 두 개가 오면 신뢰를 잃는다.
    inhibit_rules:
      - source_matchers: [alertname="IngesterDisconnected"]
        target_matchers: [alertname="NoCandlesProduced"]
        equal: [namespace]
    receivers:
      - name: default
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
spec:
  selector: { app: alertmanager }
  ports:
    - { name: http, port: 9093, targetPort: 9093 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels: { app: alertmanager }
  template:
    metadata:
      labels: { app: alertmanager }
      annotations:
        checksum/config: {{ (.Files.Glob "files/prometheus/*.yml").AsConfig | sha256sum }}
    spec:
      containers:
        - name: alertmanager
          image: {{ .Values.observability.alertmanagerImage }}
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - { containerPort: 9093, name: http }
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager }
            - { name: data, mountPath: /alertmanager }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
        - name: data
          emptyDir: {}
{{- end }}
