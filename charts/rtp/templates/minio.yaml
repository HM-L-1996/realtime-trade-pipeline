{{- if .Values.minio.enabled }}
{{/*
  S3 호환 오브젝트 스토리지. Flink 체크포인트/세이브포인트를 여기 둔다.
  JM/TM 이 서로 다른 노드에 뜨는데 kind 기본 StorageClass 는 ReadWriteOnce 라
  노드를 넘어 공유되지 않는다. 오브젝트 스토리지가 유일한 선택지다.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
type: Opaque
stringData:
  accesskey: {{ .Values.minio.accessKey | quote }}
  secretkey: {{ .Values.minio.secretKey | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: minio-credentials, key: accesskey } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: minio-credentials, key: secretkey } }
          ports:
            - { containerPort: 9000, name: api }
            - { containerPort: 9001, name: console }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.minio.storage }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: {{ .Values.minio.mcImage }}
          env:
            - name: AK
              valueFrom: { secretKeyRef: { name: minio-credentials, key: accesskey } }
            - name: SK
              valueFrom: { secretKeyRef: { name: minio-credentials, key: secretkey } }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until mc alias set local http://minio:9000 "$AK" "$SK" >/dev/null 2>&1; do
                echo "MinIO 대기..."; sleep 5
              done
              mc mb --ignore-existing local/{{ .Values.minio.bucket }}
              mc ls local/
{{- end }}
