# 장애 실험용 계측. 여기서 뽑는 값이 failure-notes.md의 근거가 된다.
global:
  scrape_interval: 5s        # 체크포인트 주기가 10s라 그보다 촘촘해야 의미가 있다
  evaluation_interval: 15s

scrape_configs:
  - job_name: flink-jobmanager
    static_configs:
      - targets: ['jobmanager:9249']
        labels: { component: jobmanager }

  - job_name: flink-taskmanager
    static_configs:
      - targets: ['taskmanager:9249']
        labels: { component: taskmanager }
    # TM을 스케일아웃하면 여기 타깃을 늘려야 한다.
    # (K8s 이전 후에는 서비스 디스커버리로 대체된다)

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # 수집기. 소스 유실률과 내 파이프라인 버그를 구분하는 지표가 여기서 나온다.
  - job_name: ingester
    static_configs:
      - targets: ['ingester:9200']

  # Kafka. 컨슈머 lag 이 여기서 나온다 - Flink 가 유입을 따라가는지 판단하는 기준.
  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']

  # ClickHouse 내장 엔드포인트. 파트 수·머지 지연·삽입 실패를 본다.
  # 파트 수가 치솟으면 "too many parts" 로 적재가 막힌다.
  - job_name: clickhouse
    static_configs:
      - targets: ['clickhouse:9363']
