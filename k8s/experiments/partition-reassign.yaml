# 실험: 파티션을 늘리면 종목별 순서와 처리가 어떻게 되는가
#
# 배경. 수집기는 종목을 키로 삼아 보낸다(IngesterMain). 그러면 같은 종목은
# 같은 파티션에 모이고 종목 단위 순서가 보장된다. **파티션 수가 바뀌기 전까지는.**
# Kafka 의 기본 파티셔너는 murmur2(key) % numPartitions 이므로 분모가 바뀌면
# 같은 키가 다른 파티션으로 간다. 옛 레코드는 옛 파티션에 그대로 남는다.
#
# 미리 계산해 둔 배정표 (실측으로 검증함)
#
#   종목      N=3  N=4  N=5  N=6  N=7
#   005930     2    2    1    2    6
#   000660     1    3    0    1    5
#
# 3 -> 6 은 아무것도 움직이지 않고, 3 -> 7 은 둘 다 움직인다.
# 그래서 이 실험은 **3 -> 7** 로 간다.
#
# 확인하려는 것
#   1. Flink 가 새 파티션을 언제 발견하는가 (디스커버리 주기가 기본값이다)
#   2. 발견하기 전까지 그 종목의 체결은 어떻게 되는가
#   3. 발견한 뒤 옛 파티션에 남아 있던 레코드가 늦어져 버려지는가
#
# 실행
#   kubectl apply -f k8s/experiments/partition-reassign.yaml
#   (3분쯤 뒤) kafka-topics.sh --alter --topic trades.exp.reassign --partitions 7
#   kubectl delete -f k8s/experiments/partition-reassign.yaml
---
apiVersion: batch/v1
kind: Job
metadata:
  name: reassign-load
  namespace: rtp
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: synth
          image: rtp-ingester:0.1.2
          imagePullPolicy: Never
          command: ["java", "-cp", "/app/ingester.jar", "dev.rtp.ingester.SyntheticMain"]
          # 초당 20건이면 파티션당 분포를 보기에 충분하고 백프레셔는 안 걸린다.
          args: ["--rate", "20", "--duration", "1200", "--symbols", "005930,000660", "--seed", "77"]
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.rtp.svc.cluster.local:9092
            # **운영 토픽이 아니다.** 여기를 trades.raw 로 두었다가 실검증을 망친 적이 있다.
            - name: KAFKA_TRADES_TOPIC
              value: trades.exp.reassign
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: exp-reassign
  namespace: rtp
spec:
  image: rtp-aggregator:0.1.3
  imagePullPolicy: Never
  flinkVersion: v1_20
  serviceAccount: flink
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "3"
    parallelism.default: "3"
    state.backend.type: hashmap
    execution.checkpointing.interval: 10s
    execution.checkpointing.dir: s3://warehouse/flink-exp/checkpoints
    execution.checkpointing.savepoint-dir: s3://warehouse/flink-exp/savepoints
    s3.endpoint: http://minio.rtp.svc.cluster.local:9000
    s3.path.style.access: "true"
    restart-strategy.type: exponential-delay
  podTemplate:
    spec:
      containers:
        - name: flink-main-container
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: minio-credentials, key: accesskey } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: minio-credentials, key: secretkey } }
            - name: CLICKHOUSE_USER
              valueFrom: { secretKeyRef: { name: clickhouse-credentials, key: user } }
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: clickhouse-credentials, key: password } }
  jobManager:
    resource: { memory: "1024m", cpu: 0.3 }
  taskManager:
    resource: { memory: "1536m", cpu: 0.5 }
  job:
    jarURI: local:///opt/flink/usrlib/aggregator.jar
    entryClass: dev.rtp.aggregator.CandleJob
    parallelism: 3
    upgradeMode: stateless
    state: running
    args:
      - --topic
      - trades.exp.reassign
      - --group-id
      - exp-reassign
      - --start-offsets
      - earliest
      - --bootstrap-servers
      - kafka.rtp.svc.cluster.local:9092
      - --clickhouse-url
      - http://clickhouse.rtp.svc.cluster.local:8123
      - --candles-table
      - rtp.candles_exp
      - --run-id
      - reassign
      - --idleness-seconds
      - "10"
      - --watermark-delay-seconds
      - "5"
      # 늦게 도착한 것을 **버리게** 둔다. 버려지는 건수가 이 실험의 관측 대상이다.
      - --allowed-lateness-seconds
      - "0"
      # 원본은 적재하지 않는다. trades_raw 는 실데이터 검증용이라 섞이면 안 된다.
      # 파티션 배정은 Kafka 에서 직접 읽어 확인한다.
      - --archive-trades
      - "false"
      # 대조군을 만들려면 여기를 0 으로 두면 된다 (Flink 기본값 = 꺼짐).
      # 0 으로 두면 새 파티션을 영원히 읽지 않는다 - 실측으로 확인했다.
      - --partition-discovery-seconds
      - "30"
