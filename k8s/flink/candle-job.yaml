# 분봉 집계 잡. Flink Kubernetes Operator 의 Application 모드.
#
# compose 에서 `flink run` 으로 제출하던 것을 선언적 배포로 바꾼 것이다.
# 차이가 중요한데, Operator 는 이 CR 을 "원하는 상태" 로 보고 수렴시킨다 -
# JobManager 가 죽으면 다시 만들고, spec 을 바꾸면 savepoint 를 뜬 뒤 재배포한다.
#
# 로컬에서 이미 확인한 것들이 여기 그대로 반영돼 있다.
#   - 재시작 전략은 잡 코드가 아니라 클러스터 설정 (고정 지연 50초로 두었다가
#     TaskManager 재생성 때 잡이 FAILED 로 끝났다)
#   - 시작 오프셋 기본값은 committed (earliest 로 두었다가 재배포 한 번에
#     420개 윈도가 중복됐다)
#   - 상태 연산자마다 uid 고정 (savepoint 재개의 성립 조건)
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: candle-1m
  namespace: rtp
spec:
  image: rtp-aggregator:0.1.0
  # kind 는 로컬 이미지를 노드에 적재해 쓴다(kind load). 레지스트리에서 받지 않도록.
  imagePullPolicy: Never
  flinkVersion: v1_20
  serviceAccount: flink

  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "3"
    parallelism.default: "3"

    # --- 체크포인트 ---
    # MinIO(S3)에 둔다. JM/TM 이 다른 노드에 뜨는데 kind 기본 StorageClass 는
    # ReadWriteOnce 라 노드를 넘어 공유되지 않는다.
    state.backend.type: rocksdb
    state.backend.incremental: "true"
    execution.checkpointing.interval: 10s
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    execution.checkpointing.dir: s3://warehouse/flink/checkpoints
    execution.checkpointing.savepoint-dir: s3://warehouse/flink/savepoints

    # --- S3(MinIO) ---
    s3.endpoint: http://minio.rtp.svc.cluster.local:9000
    # MinIO 는 path-style 이어야 한다. virtual-host 방식은
    # bucket.minio:9000 으로 붙으려 해서 DNS 가 안 잡힌다.
    s3.path.style.access: "true"
    s3.access-key: rtpadmin
    s3.secret-key: rtpadmin123

    # --- 재시작 전략 ---
    # 고정 지연(10회 x 5초 = 50초)으로 두었다가 TaskManager 재생성 때
    # 컨테이너가 돌아오기 전에 시도를 다 쓰고 잡이 FAILED 로 끝났다.
    # K8s 에서는 Pod 재스케줄이 더 느리므로 여유가 더 필요하다.
    restart-strategy.type: exponential-delay
    restart-strategy.exponential-delay.initial-backoff: 5 s
    restart-strategy.exponential-delay.max-backoff: 2 min
    restart-strategy.exponential-delay.backoff-multiplier: "2.0"
    restart-strategy.exponential-delay.reset-backoff-threshold: 10 min
    restart-strategy.exponential-delay.jitter-factor: "0.1"

    # --- 관측 ---
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249"

    # --- HA ---
    # JobManager 가 죽어도 잡이 살아남는지가 실험 대상이다.
    # ConfigMap 기반 리더 선출을 쓴다(ZooKeeper 불필요).
    high-availability.type: kubernetes
    high-availability.storageDir: s3://warehouse/flink/ha

  jobManager:
    resource:
      memory: "1600m"
      cpu: 0.5
  taskManager:
    resource:
      memory: "2048m"
      cpu: 1

  job:
    jarURI: local:///opt/flink/usrlib/aggregator.jar
    entryClass: dev.rtp.aggregator.CandleJob
    parallelism: 3
    # upgradeMode: savepoint - spec 을 바꾸면 savepoint 를 뜬 뒤 그 지점에서 재개한다.
    # 로컬 실측에서 cancel 후 재시작은 진행 중이던 윈도가 -67% 잘렸고
    # savepoint 재개는 손실 0 이었다. 그 차이를 선언적으로 보장받는 것이 목적이다.
    upgradeMode: savepoint
    state: running
    args:
      - --topic
      - trades.raw
      - --group-id
      - rtp-candle-k8s
      - --bootstrap-servers
      - kafka.rtp.svc.cluster.local:9092
      - --clickhouse-url
      - http://clickhouse.rtp.svc.cluster.local:8123
      - --watermark-delay-seconds
      - "5"
      - --idleness-seconds
      - "10"
      - --run-id
      - k8s-wm5
