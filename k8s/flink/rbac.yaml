# Flink 잡이 자기 TaskManager Pod 과 ConfigMap(리더 선출용)을 만들 권한.
#
# Operator 헬름 차트는 자기 네임스페이스(flink)에만 RBAC 을 만든다.
# 잡은 rtp 네임스페이스에서 도므로 여기에 직접 만들어 준다.
# 이게 없으면 JobManager 가 TaskManager 를 못 띄우고 Pod 이 Pending 에 걸린다.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: rtp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink
  namespace: rtp
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    # HA 와 체크포인트 포인터를 ConfigMap 으로 관리한다.
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/finalizers"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink
  namespace: rtp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flink
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: rtp
