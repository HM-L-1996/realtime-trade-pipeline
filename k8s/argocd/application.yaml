# ArgoCD Application. 이 저장소의 Helm 차트를 클러스터에 수렴시킨다.
#
# GitOps 로 얻는 것: 클러스터 상태의 근거가 **저장소**가 된다.
# kubectl apply 로 손댄 것은 다음 동기화에서 되돌아간다(selfHeal).
# "누가 언제 무엇을 바꿨나" 가 git log 로 답해진다.
#
# 적용:
#   kubectl apply -f k8s/argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rtp
  namespace: argocd
  finalizers:
    # 앱을 지울 때 배포한 리소스도 같이 지운다. 없으면 고아 리소스가 남는다.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/HM-L-1996/realtime-trade-pipeline.git
    targetRevision: main
    path: charts/rtp
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: rtp

  syncPolicy:
    automated:
      # 저장소에서 사라진 리소스를 클러스터에서도 지운다.
      prune: true
      # 손으로 고친 것을 되돌린다. GitOps 의 요점이다.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # StatefulSet 의 volumeClaimTemplates 는 변경 불가 필드가 많다.
      # 차이가 나도 동기화를 막지 않도록 서버사이드 적용을 쓴다.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    # Operator 는 잡을 suspend/resume 하면서 이 필드를 직접 바꾼다.
    # 그것만 제외한다.
    #
    # 처음에는 /spec/flinkConfiguration 도 통째로 제외했는데 **근거가 없었다.**
    # 라이브 CR 을 떠 보니 23개 키가 전부 차트에서 온 것이고 Operator 가 추가한
    # 키는 하나도 없었다. 그 상태로 두면 체크포인트 모드·재시작 전략 같은 것이
    # 손으로 바뀌어도 selfHeal 이 되돌리지 않는다 -
    # "kubectl 로 손댄 것은 되돌아간다" 는 이 문서 위쪽 주장이 거짓이 된다.
    - group: flink.apache.org
      kind: FlinkDeployment
      jsonPointers:
        - /spec/job/state

    # StatefulSet 의 volumeClaimTemplates 에 Kubernetes 가 기본값을 채워 넣는다 -
    # volumeMode: Filesystem, apiVersion, kind, status.phase. 차트에는 그게 없으니
    # 차이로 잡히고 **영원히 OutOfSync** 가 된다. 리소스는 Healthy 인데 동기화만
    # 빨간불이면 진짜 drift 가 묻힌다.
    #
    # 무시해도 되는 이유: volumeClaimTemplates 는 사실상 변경 불가 필드다.
    # 스토리지 크기를 바꾸려면 StatefulSet 을 다시 만들어야 하므로,
    # 여기서 drift 를 감지해 봐야 자동으로 적용할 수 없다.
    # 대신 **크기를 바꿀 때는 ArgoCD 가 알려주지 않는다**는 것을 알고 있어야 한다.
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
