# ClickHouse 단일 노드. Altinity 오퍼레이터를 쓰지 않는 이유는 Kafka 와 같다 -
# 이 프로젝트가 채우려는 공백이 "ClickHouse 를 K8s 에 올리는 법" 이 아니다.
# 샤딩·복제가 필요해지면 그때 오퍼레이터로 간다.
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: rtp
spec:
  selector:
    app: clickhouse
  ports:
    - name: http          # 검증 쿼리와 Flink 싱크가 쓰는 포트
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
    - name: metrics       # 내장 Prometheus 엔드포인트
      port: 9363
      targetPort: 9363
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: rtp
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8
          ports:
            - { containerPort: 8123, name: http }
            - { containerPort: 9000, name: native }
            - { containerPort: 9363, name: metrics }
          env:
            - { name: CLICKHOUSE_DB, value: rtp }
            - { name: CLICKHOUSE_USER, value: rtp }
            - { name: CLICKHOUSE_PASSWORD, value: rtp }
            - { name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
            # 초기화 SQL. ClickHouse 는 **데이터 디렉터리가 비어 있을 때만** 이걸 실행한다.
            # PVC 가 이미 차 있으면 건너뛴다 - 스키마를 바꾸면 수동 적용이 필요하다.
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            # 디렉터리째 마운트하면 이미지의 기본 설정이 가려진다.
            # compose 에서 그렇게 했다가 listen_host 가 사라져 컨테이너 밖에서
            # 접근이 끊겼다. 파일 하나만 subPath 로 얹는다.
            - { name: chconfig, mountPath: /etc/clickhouse-server/config.d/prometheus.xml, subPath: prometheus.xml, readOnly: true }
          readinessProbe:
            httpGet: { path: /ping, port: 8123 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 300m, memory: 1Gi }
            limits: { memory: 3Gi }
      volumes:
        - name: initdb
          configMap: { name: clickhouse-initdb }
        - name: chconfig
          configMap: { name: clickhouse-config }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
