# 토픽을 명시 생성한다. auto-create 에 맡기면 파티션 수가 조용히 1이 되어
# "파티션을 늘렸을 때 종목별 순서" 실험의 전제가 무너진다. compose 와 같은 이유다.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  namespace: rtp
spec:
  # 클러스터를 다시 만들 때 재실행되도록 완료 후에도 남긴다.
  ttlSecondsAfterFinished: 3600
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: apache/kafka:3.9.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              BS=kafka:9092
              # 브로커가 뜰 때까지 기다린다. Job 은 Pod readiness 를 기다려 주지 않는다.
              until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server $BS >/dev/null 2>&1; do
                echo "브로커 대기..."; sleep 5
              done
              for t in trades.raw trades.replay; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server $BS \
                  --create --if-not-exists --topic $t --partitions 3 --replication-factor 1
              done
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server $BS --list
