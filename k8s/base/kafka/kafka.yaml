# 단일 브로커 KRaft. Strimzi 를 쓰지 않는 이유는 이 프로젝트가 채우려는 공백이
# "Kafka 를 K8s 에 올리는 법" 이 아니기 때문이다. 오퍼레이터를 하나 더 얹으면
# 움직이는 부품만 늘고 compose 구성과의 대응 관계도 흐려진다.
# 운영이라면 Strimzi 가 맞다.
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: rtp
spec:
  clusterIP: None          # StatefulSet Pod 에 안정적인 DNS 를 주기 위한 것
  selector:
    app: kafka
  ports:
    - name: internal
      port: 9092
    - name: controller
      port: 9093
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: rtp
spec:
  selector:
    app: kafka
  ports:
    - name: internal
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: rtp
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - containerPort: 9092
              name: internal
            - containerPort: 9093
              name: controller
          env:
            # 이게 없으면 Kafka 는 /tmp/kafka-logs 에 쓴다.
            # 아래 volumeMounts 로 PVC 를 붙여 놓아도 **아무것도 쓰이지 않는다.**
            # compose 에서 실제로 이 상태였다 - 볼륨은 4KB, /tmp 는 148MB.
            # 매니페스트만 보면 영속되는 것처럼 보이는 것이 이 실수의 함정이다.
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka-0.kafka-headless.rtp.svc.cluster.local:9093
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            # Pod DNS 를 광고한다. Service 이름을 광고하면 컨슈머가
            # 브로커에 직접 붙지 못한다 - Kafka 는 클라이언트에게 브로커 주소를
            # 그대로 돌려주고 클라이언트가 그 주소로 다시 접속하기 때문이다.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka-0.kafka-headless.rtp.svc.cluster.local:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            # Flink exactly-once 싱크는 Kafka 트랜잭션을 쓴다.
            # 체크포인트 주기보다 짧으면 트랜잭션이 타임아웃되며 조용히 유실된다.
            - name: KAFKA_TRANSACTION_MAX_TIMEOUT_MS
              value: "900000"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits: { memory: 2Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
