# 로컬 K8s 클러스터. GUI 토글 대신 파일로 두는 이유는 재현 때문이다 -
# 클러스터를 지우고 다시 만들어도 같은 구성이 나와야 실험 결과를 비교할 수 있다.
#
#   kind create cluster --config k8s/cluster/kind-cluster.yaml
#
# 워커를 2개 두는 이유: TaskManager Pod 을 강제 종료했을 때
# **다른 노드로 재스케줄되는지** 를 봐야 하는데, 단일 노드에서는 그 경로가 없다.
# failure-notes 의 "TaskManager Pod 강제 종료" 실험이 반쪽이 된다.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: rtp

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Flink Web UI. NodePort 30081 -> 호스트 8081
      - containerPort: 30081
        hostPort: 18081
        protocol: TCP
      # Grafana
      - containerPort: 30300
        hostPort: 13000
        protocol: TCP
      # ArgoCD
      - containerPort: 30080
        hostPort: 18080
        protocol: TCP
  - role: worker
  - role: worker
