# 로컬 K8s 클러스터. GUI 토글 대신 파일로 두는 이유는 재현 때문이다 -
# 클러스터를 지우고 다시 만들어도 같은 구성이 나와야 실험 결과를 비교할 수 있다.
#
#   kind create cluster --config k8s/cluster/kind-cluster.yaml
#
# 워커를 2개 두는 이유: TaskManager Pod 을 강제 종료했을 때
# **다른 노드로 재스케줄되는지** 를 봐야 하는데, 단일 노드에서는 그 경로가 없다.
# failure-notes 의 "TaskManager Pod 강제 종료" 실험이 반쪽이 된다.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: rtp

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # 전부 listenAddress 를 127.0.0.1 로 고정한다. 이걸 빼면 Docker 는 기본으로
      # 0.0.0.0 에 바인딩하는데, 그러면 인증 없는 Flink UI·Grafana·ArgoCD 가
      # **같은 네트워크(Wi-Fi 등)의 다른 기기에서도** 열린다 - 이 호스트 자신만
      # 접근하게 하려던 의도(localhost:PORT)와 다르다.
      #
      # Flink Web UI. NodePort 30081 -> 호스트 8081
      - containerPort: 30081
        hostPort: 18081
        listenAddress: "127.0.0.1"
        protocol: TCP
      # Grafana
      - containerPort: 30300
        hostPort: 13000
        listenAddress: "127.0.0.1"
        protocol: TCP
      # ArgoCD
      - containerPort: 30080
        hostPort: 18080
        listenAddress: "127.0.0.1"
        protocol: TCP
      # Superset. **이미 떠 있는 클러스터에는 소급되지 않는다** -
      # 포트 매핑은 노드 컨테이너를 만들 때 정해지므로 클러스터를 다시 만들어야 열린다.
      # 기존 클러스터에서는 port-forward 로 붙는다:
      #   kubectl -n rtp port-forward svc/superset 8088:8088
      - containerPort: 30088
        hostPort: 18088
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
  - role: worker
