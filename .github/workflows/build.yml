# 테스트가 통과한다는 것을 방문자가 확인할 수 있게 한다.
# 저장소만 보고는 29개 테스트가 도는지 알 수 없었다.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 빌드 + 테스트
        run: mvn -B verify

      # 차트가 렌더링되는지도 본다. 매니페스트가 깨진 채 머지되면
      # ArgoCD 가 동기화 단계에서 실패하고, 그건 배포 후에야 드러난다.
      - name: Helm 차트 검증
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint charts/rtp
          helm template rtp charts/rtp --namespace rtp > rendered.yaml

      # helm lint 는 ConfigMap 의 data 안에 든 문자열을 들여다보지 않는다.
      # Helm 에게는 그냥 문자열이라 문법도 의미도 검사 대상이 아니다.
      #
      # **그래서 알람 규칙이 통째로 죽어 있는 것을 CI 가 잡지 못했다.**
      # rule_files 누락으로 규칙이 한 번도 평가되지 않았는데 lint 는 통과했다.
      # 렌더된 결과에서 설정을 꺼내 promtool 로 따로 검사한다.
      - name: Prometheus 설정·알람 규칙 검증
        run: |
          python3 - <<'EOF'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('rendered.yaml')) if d]
          cm = next(d for d in docs
                    if d.get('kind') == 'ConfigMap'
                    and d['metadata']['name'] == 'prometheus-config')
          open('prometheus.yml', 'w').write(cm['data']['prometheus.yml'])
          open('alerts.yml', 'w').write(cm['data']['alerts.yml'])

          cfg = yaml.safe_load(cm['data']['prometheus.yml'])
          # 규칙 파일을 실제로 로드하는지 본다. 이 검사가 없어서 당했다.
          assert cfg.get('rule_files'), 'rule_files 가 없다 - 알람 규칙이 평가되지 않는다'
          assert cfg.get('alerting', {}).get('alertmanagers'),               'alerting 대상이 없다 - 발화해도 전달되지 않는다'
          print('rule_files:', cfg['rule_files'])
          EOF

          docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool             prom/prometheus:v3.1.0 check config prometheus.yml || true
          docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool             prom/prometheus:v3.1.0 check rules alerts.yml
