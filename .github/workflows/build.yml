# 테스트가 통과한다는 것을 방문자가 확인할 수 있게 한다.
# 저장소만 보고는 29개 테스트가 도는지 알 수 없었다.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 빌드 + 테스트
        run: mvn -B verify

      # 차트가 렌더링되는지도 본다. 매니페스트가 깨진 채 머지되면
      # ArgoCD 가 동기화 단계에서 실패하고, 그건 배포 후에야 드러난다.
      - name: Helm 차트 검증
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint charts/rtp
          helm template rtp charts/rtp --namespace rtp > /dev/null
